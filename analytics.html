<!-- analytics.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — LeadAI</title>
<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; display: flex; height: 100vh; }

  .logo { font-size: 18px; font-weight: 700; color: #f8fafc; margin-bottom: 24px; padding: 0 8px; }
  .logo span { color: #6366f1; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { padding: 20px 28px;  border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 14px; }
  .topbar h1 { font-size: 20px; font-weight: 600; }
  body.sidebar-hidden .main { flex: 1; }

  .analytics-panel { flex: 1; padding: 24px 28px; overflow-y: auto; background: #0f172a; }
  .analytics-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; margin-bottom: 28px; }
  .analytics-tile { background: #161e2e; border: 1px solid #334155; border-radius: 18px; padding: 22px 20px; color: #e2e8f0; }
  .analytics-tile-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
  .analytics-tile-value { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; color: #fff; }
  .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
  .analytics-card { background: #161e2e; border: 1px solid #334155; border-radius: 20px; padding: 22px; color: #e2e8f0; display: flex; flex-direction: column; box-shadow: 0 18px 45px rgba(0,0,0,0.18); }
  .analytics-card h3 { font-size: 15px; font-weight: 800; margin-bottom: 16px; color: #f8fafc; }
  .analytics-card canvas { width: 100% !important; height: 280px !important; }

  .loading { text-align: center; padding: 60px; color: #475569; font-size: 15px; }
  .spinner { width: 32px; height: 32px; border: 3px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  app-chatbot { display: contents; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #111827; }
  ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #4B5563; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/components.js" defer></script>
</head>
<body>

<app-sidebar active="analytics"></app-sidebar>

<div class="main">
  <div class="topbar">
    <h1>Analytics</h1>
  </div>

  <div class="analytics-panel">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      Loading analytics...
    </div>
    <div id="analytics-summary" class="analytics-summary" style="display:none"></div>
    <div class="analytics-grid" id="analytics-grid" style="display:none">
      <div class="analytics-card"><h3>Status Distribution</h3><canvas id="status-chart"></canvas></div>
      <div class="analytics-card"><h3>Leads by Industry</h3><canvas id="industry-chart"></canvas></div>
      <div class="analytics-card"><h3>Leads by Country</h3><canvas id="country-chart"></canvas></div>
      <div class="analytics-card"><h3>Score Distribution</h3><canvas id="score-chart"></canvas></div>
      <div class="analytics-card"><h3>Engagement by Type</h3><canvas id="engagement-chart"></canvas></div>
      <div class="analytics-card"><h3>Top 10 Priority Leads</h3><canvas id="priority-chart"></canvas></div>
      <div class="analytics-card"><h3>Company Size Distribution</h3><canvas id="size-chart"></canvas></div>
    </div>
  </div>
</div>

<app-chatbot></app-chatbot>

<script>
function filterLeads() {} // filter not applicable on analytics page

function countByField(leads, field) {
  return leads.reduce((acc, lead) => {
    const key = lead[field] ? String(lead[field]).trim() : 'Unknown';
    if (!key) return acc;
    acc[key] = (acc[key] || 0) + 1;
    return acc;
  }, {});
}

function bucketScores(leads) {
  const buckets = { '0-40 (Cold)': 0, '41-70 (Warm)': 0, '71-100 (Hot)': 0 };
  leads.forEach(lead => {
    const score = Number(lead.score) || 0;
    if (score <= 40) buckets['0-40 (Cold)'] += 1;
    else if (score <= 70) buckets['41-70 (Warm)'] += 1;
    else buckets['71-100 (Hot)'] += 1;
  });
  return buckets;
}

function bucketCompanySize(leads) {
  const buckets = { '1-50': 0, '51-200': 0, '201-500': 0, '500+': 0 };
  leads.forEach(lead => {
    const size = Number(lead.company_size) || 0;
    if (size <= 50) buckets['1-50'] += 1;
    else if (size <= 200) buckets['51-200'] += 1;
    else if (size <= 500) buckets['201-500'] += 1;
    else buckets['500+'] += 1;
  });
  return buckets;
}

function topPriorityLeads(leads) {
  return leads
    .map(lead => ({ label: lead.full_name || 'Unknown', value: Number(lead.priority_rank) > 0 ? Number(lead.priority_rank) : 999 }))
    .sort((a, b) => a.value - b.value)
    .slice(0, 10)
    .reverse();
}

function chartOptions() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: '#cbd5e1' }, grid: { color: '#334155' } },
      y: { ticks: { color: '#cbd5e1' }, grid: { color: '#334155' } }
    }
  };
}

let analyticsCharts = {};

function resetAnalyticsCharts() {
  Object.values(analyticsCharts).forEach(chart => chart?.destroy());
  analyticsCharts = {};
}

function renderAnalytics(leads) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('analytics-summary').style.display = 'grid';
  document.getElementById('analytics-grid').style.display = 'grid';

  const totalLeads = leads.length;
  const averageScore = totalLeads
    ? (leads.reduce((sum, l) => sum + (Number(l.score) || 0), 0) / totalLeads).toFixed(1)
    : '0.0';
  const totalInteractions = leads.reduce((sum, l) => sum + (Number(l.interaction_count) || 0), 0);
  const linkedinCount = leads.filter(l => l.linkedin_profile && String(l.linkedin_profile).trim()).length;
  const emailCount = leads.filter(l => l.work_email && String(l.work_email).trim()).length;

  document.getElementById('analytics-summary').innerHTML = [
    { title: 'Total Leads', value: totalLeads },
    { title: 'Average Score', value: averageScore },
    { title: 'Total Interactions', value: totalInteractions },
    { title: 'Leads with LinkedIn', value: linkedinCount },
    { title: 'Leads with Email', value: emailCount }
  ].map(item => `
    <div class="analytics-tile">
      <div class="analytics-tile-title">${item.title}</div>
      <div class="analytics-tile-value">${item.value}</div>
    </div>
  `).join('');

  const statusCounts = countByField(leads, 'status');
  const industryCounts = countByField(leads, 'industry');
  const countryCounts = countByField(leads, 'country');
  const engagementCounts = countByField(leads, 'engagement');
  const scoreCounts = bucketScores(leads);
  const companySizeCounts = bucketCompanySize(leads);
  const priorityData = topPriorityLeads(leads);

  resetAnalyticsCharts();

  analyticsCharts.status = new Chart(document.getElementById('status-chart'), {
    type: 'pie',
    data: {
      labels: Object.keys(statusCounts),
      datasets: [{ data: Object.values(statusCounts), backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6'], borderColor: '#0f172a', borderWidth: 1 }]
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1' } } } }
  });

  analyticsCharts.industry = new Chart(document.getElementById('industry-chart'), {
    type: 'bar',
    data: { labels: Object.keys(industryCounts), datasets: [{ label: 'Leads', data: Object.values(industryCounts), backgroundColor: '#6366f1' }] },
    options: chartOptions()
  });

  analyticsCharts.country = new Chart(document.getElementById('country-chart'), {
    type: 'bar',
    data: { labels: Object.keys(countryCounts), datasets: [{ label: 'Leads', data: Object.values(countryCounts), backgroundColor: '#6366f1' }] },
    options: chartOptions()
  });

  analyticsCharts.score = new Chart(document.getElementById('score-chart'), {
    type: 'bar',
    data: { labels: Object.keys(scoreCounts), datasets: [{ label: 'Leads', data: Object.values(scoreCounts), backgroundColor: '#6366f1' }] },
    options: chartOptions()
  });

  analyticsCharts.engagement = new Chart(document.getElementById('engagement-chart'), {
    type: 'bar',
    data: { labels: Object.keys(engagementCounts), datasets: [{ label: 'Leads', data: Object.values(engagementCounts), backgroundColor: '#6366f1' }] },
    options: chartOptions()
  });

  analyticsCharts.priority = new Chart(document.getElementById('priority-chart'), {
    type: 'bar',
    data: {
      labels: priorityData.map(i => i.label),
      datasets: [{ label: 'Priority Rank', data: priorityData.map(i => i.value), backgroundColor: '#6366f1' }]
    },
    options: {
      ...chartOptions(),
      indexAxis: 'y',
      scales: {
        x: { ticks: { color: '#cbd5e1' }, grid: { color: '#334155' } },
        y: { ticks: { color: '#cbd5e1' }, grid: { display: false } }
      }
    }
  });

  analyticsCharts.companySize = new Chart(document.getElementById('size-chart'), {
    type: 'bar',
    data: { labels: Object.keys(companySizeCounts), datasets: [{ label: 'Leads', data: Object.values(companySizeCounts), backgroundColor: '#6366f1' }] },
    options: chartOptions()
  });
}

async function loadAnalytics() {
  try {
    const res = await fetch('/api/leads');
    const leads = await res.json();
    renderAnalytics(leads);
  } catch (err) {
    document.getElementById('loading').innerHTML = '<p style="color:#ef4444">Failed to load analytics data.</p>';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadAnalytics();
  restoreSidebarState();
});
</script>
</body>
</html>
