<!-- sales_assistant.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Assistant — LeadAI</title>
<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; display: flex; height: 100vh; overflow: hidden;}
  
  .logo { font-size: 18px; font-weight: 700; color: #f8fafc; margin-bottom: 24px; padding: 0 8px; }
  .logo span { color: #6366f1; }
  .filter-title { font-size: 11px; color: #475569; text-transform: uppercase; letter-spacing: 0.08em; padding: 16px 12px 8px; }
  .filter-btn { padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; color: #94a3b8; }
  .filter-btn:hover { background: #334155; color: #f8fafc; }
  .filter-btn.active { background: #334155; color: #f8fafc; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-hot { background: #ef4444; }
  .dot-warm { background: #f59e0b; }
  .dot-cold { background: #3b82f6; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; height: 100vh; }
  .topbar { padding: 20px 28px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 14px; }
  .topbar p { margin: 0; }
  body.sidebar-hidden .main { flex: 1; }
  .topbar h1 { font-size: 20px; font-weight: 600; }
  .topbar p { font-size: 13px; color: #64748b; margin-top: 4px; }

  .content { flex: 1; display: flex; height: calc(100vh - 77px); overflow: hidden; }
  
  .leads-list { width: 280px; border-right: 1px solid #334155; height: 100%; overflow-y: auto; padding: 16px; flex-shrink: 0; }
  .leads-list h3 { font-size: 11px; color: #475569; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .lead-item { padding: 12px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; margin-bottom: 8px; transition: all 0.15s; }
  .lead-item:hover { background: #1e293b; border-color: #334155; }
  .lead-item.active { background: #1e3a5f; border-color: #3b82f6; }
  .lead-item-name { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
  .lead-item-role { font-size: 12px; color: #64748b; }
  .badge { padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; display: inline-block; margin-top: 4px; }
  .badge-hot { background: #450a0a; color: #f87171; }
  .badge-warm { background: #451a03; color: #fbbf24; }
  .badge-cold { background: #0c1a3d; color: #60a5fa; }

  .assistant-panel { flex: 1; height: 100%; overflow-y: auto; padding: 28px; }
  .empty-state { text-align: center; padding: 80px; color: #475569; }
  .empty-state div { font-size: 40px; margin-bottom: 16px; }
  .empty-state p { font-size: 15px; }

  .lead-header { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; }
  .lead-header-info h2 { font-size: 18px; font-weight: 600; }
  .lead-header-info p { font-size: 13px; color: #64748b; margin-top: 2px; }
  .lead-header-meta { text-align: right; font-size: 13px; color: #64748b; }

  .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .tool-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
  .tool-card.full { grid-column: 1 / -1; }
  .tool-title { font-size: 13px; font-weight: 500; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .tool-content { font-size: 13px; line-height: 1.8; color: #e2e8f0; white-space: pre-wrap; }
  
  .summary-section { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
  .summary-title { font-size: 13px; font-weight: 500; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; }
  .summary-textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: #e2e8f0; font-size: 13px; font-family: inherit; resize: vertical; min-height: 100px; margin-bottom: 12px; }
  .summary-textarea:focus { outline: none; border-color: #6366f1; }
  .generate-btn { background: #6366f1; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary-output { background: #0f172a; border-radius: 8px; padding: 14px; font-size: 13px; line-height: 1.8; color: #e2e8f0; white-space: pre-wrap; margin-top: 12px; display: none; }

  .loading-card { text-align: center; padding: 40px; color: #475569; }
  .spinner { width: 28px; height: 28px; border: 3px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  app-chatbot { display: contents; }
  ::-webkit-scrollbar { width: 6px;}
  ::-webkit-scrollbar-track { background: #111827; }
  ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px;}
  ::-webkit-scrollbar-thumb:hover { background: #4B5563;}
</style>
<script src="/components.js" defer></script>
</head>
<body>

<app-sidebar active="sales"></app-sidebar>
<div class="main">
  <div class="topbar">
    <div>
      <h1>Sales Assistant</h1>
      <p>AI-powered discovery questions, pitch suggestions and meeting summaries</p>
    </div>
  </div>

  <div class="content">
    <div class="leads-list">
      <h3>Select a Lead</h3>
      <div id="leads-container">
        <div class="loading-card"><div class="spinner"></div></div>
      </div>
    </div>

    <div class="assistant-panel" id="assistant-panel">
      <div class="empty-state">
        <div></div>
        <p>Select a lead to get AI-powered sales assistance</p>
      </div>
    </div>
  </div>
</div>

<app-chatbot></app-chatbot>

<script>
let leads = [];
let filteredLeads = [];
let selectedIndex = null;
let currentFilterCategory = 'status';
let currentFilterValue = 'all';
let currentSortToken = 'none';
let currentSearchQuery = '';

function syncSidebarUI() {
  let options = [{ value: 'all', label: 'All Leads' }];
  if (currentFilterCategory === 'status') {
    options.push({ value: 'Hot', label: 'Hot' }, { value: 'Warm', label: 'Warm' }, { value: 'Cold', label: 'Cold' });
  } else {
    let uniqueValues = [...new Set(leads.map(l => l[currentFilterCategory]).filter(Boolean))];
    uniqueValues.forEach(val => options.push({ value: val, label: val }));
  }
  window.renderSidebarSubButtons(options, currentFilterValue, 'executeSalesFilter');
}

function handleCategoryChange(category) {
  currentFilterCategory = category;
  currentFilterValue = 'all';
  syncSidebarUI();
  executeSalesFilter('all');
}
window.handleCategoryChange = handleCategoryChange;

function executeSalesFilter(value) {
  currentFilterValue = value;
  syncSidebarUI();
  applyCombinedFilters();
}
window.executeSalesFilter = executeSalesFilter;

function searchLeads(query) {
  currentSearchQuery = query.toLowerCase().trim();
  applyCombinedFilters();
}
window.searchLeads = searchLeads;

function sortLeads(sortToken) {
  currentSortToken = sortToken;
  applyCombinedFilters();
}
window.sortLeads = sortLeads;

function applyCombinedFilters() {
  let workingLeads = currentFilterValue === 'all' 
    ? [...leads] 
    : leads.filter(l => String(l[currentFilterCategory]) === currentFilterValue);
    
  if (currentSearchQuery) {
    workingLeads = workingLeads.filter(l => {
      const name = String(l.full_name || '').toLowerCase();
      const company = String(l.company_name || '').toLowerCase();
      const designation = String(l.designation || '').toLowerCase();
      
      return name.includes(currentSearchQuery) || 
             company.includes(currentSearchQuery) || 
             designation.includes(currentSearchQuery);
    });
  }
  
  if (currentSortToken === 'name-asc') {
    workingLeads.sort((a, b) => String(a.full_name || '').localeCompare(String(b.full_name || '')));
  } else if (currentSortToken === 'name-desc') {
    workingLeads.sort((a, b) => String(b.full_name || '').localeCompare(String(a.full_name || '')));
  } else if (currentSortToken === 'score-asc') {
    workingLeads.sort((a, b) => (parseInt(a.score) || 0) - (parseInt(b.score) || 0));
  } else if (currentSortToken === 'score-desc') {
    workingLeads.sort((a, b) => (parseInt(b.score) || 0) - (parseInt(a.score) || 0));
  }
  
  filteredLeads = workingLeads;
  renderLeadsList();
  
  const panel = document.getElementById('assistant-panel');
  if (filteredLeads.length === 0) {
    panel.innerHTML = `<div class="empty-state"><div><i class="fi fi-sr-info"></i></div><p>No matches found for search or filters.</p></div>`;
    selectedIndex = null;
  }
}

function sanitizeTextForHTML(text) {
  if (text == null) return '';
  return String(text)
    .replace(/[“”]/g, '"')
    .replace(/[‘’]/g, "'")
    .replace(/—/g, '&mdash;')
    .replace(/…/g, '&hellip;')
    .replace(/•/g, '&bull;')
    .replace(/→/g, '&rarr;')
    .replace(/←/g, '&larr;')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function sanitizeTextForText(text) {
  if (text == null) return '';
  return String(text)
    .replace(/[“”]/g, '"')
    .replace(/[‘’]/g, "'")
    .replace(/—/g, '-')
    .replace(/…/g, '...')
    .replace(/•/g, '-')
    .replace(/→/g, '->')
    .replace(/←/g, '<-');
}

function htmlEncode(text) {
  return sanitizeTextForHTML(text).replace(/\n/g, '<br>');
}

async function loadLeads() {
  const res = await fetch('/api/leads');
  leads = await res.json();
  syncSidebarUI();
  executeSalesFilter(currentFilterValue);
  const params = new URLSearchParams(window.location.search);
  const leadIndex = params.get('lead');
  if (leadIndex !== null) {
    selectLead(parseInt(leadIndex));
  }
}

function renderLeadsList() {
  const container = document.getElementById('leads-container');
  if (!filteredLeads.length) {
    container.innerHTML = '<div class="empty-state"><p>No leads match this filter.</p></div>';
    return;
  }
  container.innerHTML = filteredLeads.map((lead, i) => {
    const fullName = window.safeHTML(lead.full_name);
    const designation = window.safeHTML(lead.designation);
    const companyName = window.safeHTML(lead.company_name);
    const status = window.safeHTML(lead.status || 'Unknown');
    const badgeClass = lead.status ? lead.status.toLowerCase() : 'cold';
    return `
      <div class="lead-item ${selectedIndex === i ? 'active' : ''}" onclick="selectLead(${i})">
        <div class="lead-item-name">${fullName}</div>
        <div class="lead-item-role">${designation} at ${companyName}</div>
        <span class="badge badge-${badgeClass}">${status}</span>
      </div>
    `;
  }).join('');
}

async function selectLead(index) {
  selectedIndex = index;
  renderLeadsList();

  const panel = document.getElementById('assistant-panel');
  panel.innerHTML = `<div class="loading-card"><div class="spinner"></div><p style="color:#475569;font-size:13px">Generating sales intelligence...</p></div>`;

  const res = await fetch(`/api/sales-assistant/${index}`);
  const data = await res.json();
  const lead = data.lead;
  const fullName = sanitizeTextForHTML(lead.full_name);
  const designation = sanitizeTextForHTML(lead.designation);
  const companyName = sanitizeTextForHTML(lead.company_name);
  const leadStatus = sanitizeTextForHTML(lead.status || 'Unknown');
  const industry = sanitizeTextForHTML(lead.industry);
  const country = sanitizeTextForHTML(lead.country);
  const discoveryQuestions = htmlEncode(data.discovery_questions);
  const pitchSuggestion = htmlEncode(data.pitch_suggestion);

  panel.innerHTML = `
    <div class="lead-header">
      <div class="lead-header-info">
        <h2>${fullName}</h2>
        <p>${designation} at ${companyName}</p>
      </div>
      <div class="lead-header-meta">
        <span class="badge badge-${lead.status ? lead.status.toLowerCase() : 'cold'}">${leadStatus}</span>
        <div style="margin-top:6px">Score: ${sanitizeTextForText(lead.score)}/100</div>
        <div>${industry} · ${country}</div>
      </div>
    </div>

    <div class="tools-grid">
      <div class="tool-card">
        <div class="tool-title">Discovery Questions</div>
        <div class="tool-content">${discoveryQuestions}</div>
      </div>
      <div class="tool-card">
        <div class="tool-title">Pitch Suggestion</div>
        <div class="tool-content">${pitchSuggestion}</div>
      </div>
    </div>

    <div class="summary-section">
      <div class="summary-title">Meeting Summary Generator</div>
      <textarea class="summary-textarea" id="meeting-notes" placeholder="Paste your meeting notes here..."></textarea>
      <button class="generate-btn" id="summary-btn" onclick="generateSummary(${index})">Generate Summary</button>
      <div class="summary-output" id="summary-output"></div>
    </div>
  `;
}

async function generateSummary(index) {
  const notes = document.getElementById('meeting-notes').value.trim();
  if (!notes) { alert('Please enter meeting notes first'); return; }

  const btn = document.getElementById('summary-btn');
  btn.disabled = true;
  btn.textContent = 'Generating...';

  const lead = leads[index];
  const res = await fetch('/api/meeting-summary', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      lead_name: lead.full_name,
      lead_role: lead.designation,
      lead_company: lead.company_name,
      lead_industry: lead.industry,
      notes: notes
    })
  });

  const data = await res.json();
  const output = document.getElementById('summary-output');
  output.style.display = 'block';
  output.textContent = sanitizeTextForText(data.summary);

  btn.disabled = false;
  btn.textContent = 'Generate Summary';
}

document.addEventListener('DOMContentLoaded', () => {
  loadLeads();
  restoreSidebarState();
});

</script>
</body>
</html>
