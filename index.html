<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Qualifier Dashboard</title>
<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; display: flex; height: 100vh; }

  .logo { font-size: 18px; font-weight: 700; color: #f8fafc; margin-bottom: 24px; padding: 0 8px; }
  .logo span { color: #6366f1; }
  .filter-title { font-size: 11px; color: #475569; text-transform: uppercase; letter-spacing: 0.08em; padding: 16px 12px 8px; }
  .filter-btn { padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; color: #94a3b8; }
  .filter-btn:hover { background: #334155; color: #f8fafc; }
  .filter-btn.active { background: #334155; color: #f8fafc; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-hot { background: #ef4444; }
  .dot-warm { background: #f59e0b; }
  .dot-cold { background: #3b82f6; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { padding: 20px 28px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 14px; }
  .topbar h1 { font-size: 20px; font-weight: 600; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .topbar-left { display: flex; align-items: center; gap: 14px; flex: 1; }

  .stats { display: flex; gap: 12px; }
  .stat { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 8px 16px; text-align: center; }
  .stat-num { font-size: 20px; font-weight: 700; }
  .stat-label { font-size: 11px; color: #64748b; }
  .hot-num { color: #ef4444; }
  .warm-num { color: #f59e0b; }
  .cold-num { color: #3b82f6; }
  .add-btn { background: #6366f1; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .add-btn:hover { background: #4f46e5; }

  .dropdown { position: relative; }
  .dropdown-menu { position: absolute; top: 48px; right: 0; background: #1e293b; border: 1px solid #334155; border-radius: 10px; overflow: hidden; display: none; z-index: 1000; min-width: 220px; }
  .dropdown-menu.open { display: block; }
  .dropdown-item { padding: 12px 16px; cursor: pointer; font-size: 13px; color: #e2e8f0; }
  .dropdown-item:hover { background: #334155; }
  body.sidebar-hidden .main { flex: 1; }

  .content { display: flex; flex: 1; min-height: 0; overflow: hidden; }
  .table-panel { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 28px; }
  .table { width: 100%; border-collapse: collapse; }
  .table th { text-align: left; font-size: 11px; color: #475569; text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 14px; border-bottom: 1px solid #334155; position: sticky; top: 0; background: #1e293b; z-index: 10; }
  .table td { padding: 14px; border-bottom: 1px solid #1e293b; font-size: 13px; vertical-align: middle; }
  .table tr { cursor: pointer; transition: background 0.15s; }
  .table tr:hover { background: #1e293b; }
  .table tr.selected { background: #1e3a5f; }
  .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-hot { background: #450a0a; color: #f87171; }
  .badge-warm { background: #451a03; color: #fbbf24; }
  .badge-cold { background: #0c1a3d; color: #60a5fa; }
  .score-bar { width: 80px; height: 6px; background: #334155; border-radius: 3px; overflow: hidden; }
  .score-fill { height: 100%; border-radius: 3px; }
  .action-wrapper { position: relative; display: inline-flex; align-items: center; }
  .action-btn { background: #111827; border: 1px solid #334155; color: #cbd5e1; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: background 0.15s ease; }
  .action-btn:hover { background: #334155; color: #f8fafc; }
  .action-menu { position: absolute; top: calc(100% + 6px); right: 0; min-width: 140px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; box-shadow: 0 20px 35px rgba(0,0,0,0.3); display: none; z-index: 50; }
  .action-menu.open { display: block; }
  .action-menu button { width: 100%; border: none; background: transparent; color: #e2e8f0; padding: 10px 12px; text-align: left; cursor: pointer; font-size: 13px; }
  .action-menu button:hover { background: #334155; color: #fff; }
  .action-menu button.delete-btn-menu { color: #f87171; }
  .action-menu button.delete-btn-menu:hover { background: #7f1d1d; color: #fff; }

  .detail-panel { width: 360px; min-width: 360px; max-width: 360px; background: #1e293b; border-left: 1px solid #334155; padding: 24px; overflow-y: auto; flex-shrink: 0; position: relative; margin-right: -360px; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), margin-right 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
  .detail-panel.open { margin-right: 0px; transform: translateX(0); }
  .detail-action-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .detail-action-group .detail-action-btn { flex: 1; }
  .detail-action-btn.delete-detail { background: #dc2626; }
  .detail-action-btn.delete-detail:hover { background: #b91c1c; }
  .detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  .detail-name { font-size: 20px; font-weight: 700; line-height: 1.15; }
  .detail-role { font-size: 13px; color: #94a3b8; margin-top: 6px; }
  .detail-status { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; background: #111827; color: #c7d2fe; }
  .detail-close-btn { background: transparent; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; line-height: 1; padding: 0; }
  .detail-section { margin-bottom: 20px; padding-bottom: 18px; border-bottom: 1px solid #334155; }
  .detail-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .detail-section-title { font-size: 11px; color: #475569; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .detail-row { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; align-items: start; padding: 10px 0; }
  .detail-row-label { color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .detail-row-value { font-size: 13px; color: #e2e8f0; text-align: right; overflow-wrap: anywhere; word-wrap: break-word; white-space: normal; }
  .detail-row-value a { color: #93c5fd; text-decoration: none; }
  .detail-row-value a:hover { text-decoration: underline; }
  .detail-reason { background: #0f172a; padding: 14px; border-radius: 12px; font-size: 13px; line-height: 1.6; color: #cbd5e1; }
  .detail-action-btn { display: block; width: 100%; margin-top: 18px; background: #6366f1; color: #fff; border: none; padding: 12px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; text-align: center; text-decoration: none; }
  .detail-action-btn:hover { background: #4f46e5; }

  .sales-panel { display: none; padding: 20px 28px; overflow: hidden; min-height: 0; height: calc(100vh - 100px); }
  .sales-layout { display: flex; gap: 20px; min-height: 0; height: 100%; overflow: hidden; }
  .leads-list { width: 320px; border-right: 1px solid #334155; overflow-y: auto; padding: 16px; background: #1e293b; border-radius: 16px; height: 100%; }
  .leads-list h3 { font-size: 11px; color: #475569; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .lead-item { padding: 14px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; margin-bottom: 10px; transition: all 0.15s ease; background: #0f172a; }
  .lead-item:hover { background: #1e293b; border-color: #334155; }
  .lead-item.active { background: #1e3a5f; border-color: #3b82f6; }
  .lead-item-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .lead-item-role { font-size: 12px; color: #94a3b8; line-height: 1.4; }
  .assistant-panel { flex: 1; overflow-y: auto; padding: 20px; background: #1e293b; border: 1px solid #334155; border-radius: 16px; height: 100%; }
  .empty-state { text-align: center; padding: 80px 10px; color: #64748b; }
  .empty-state div { font-size: 40px; margin-bottom: 16px; }
  .empty-state p { font-size: 15px; }
  .lead-header { background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 22px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
  .lead-header-info h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .lead-header-info p { font-size: 13px; color: #94a3b8; }
  .lead-header-meta { text-align: right; font-size: 13px; color: #94a3b8; display: grid; gap: 6px; }
  .tools-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-bottom: 24px; }
  .tool-card { background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 20px; }
  .tool-title { font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; }
  .tool-content { font-size: 13px; line-height: 1.8; color: #e2e8f0; white-space: pre-wrap; }
  .summary-section { background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 20px; }
  .summary-title { font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; }
  .summary-textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; color: #e2e8f0; font-size: 13px; font-family: inherit; resize: vertical; min-height: 100px; margin-bottom: 12px; }
  .summary-textarea:focus { outline: none; border-color: #6366f1; }
  .generate-btn { background: #6366f1; color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary-output { background: #0f172a; border-radius: 12px; padding: 14px; font-size: 13px; line-height: 1.8; color: #e2e8f0; white-space: pre-wrap; margin-top: 12px; display: none; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.open { display: flex; }
  .modal { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 28px; width: 480px; max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
  .form-group input, .form-group select, .form-group textarea { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px 12px; color: #e2e8f0; font-size: 13px; font-family: inherit; }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #6366f1; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
  .cancel-btn { background: transparent; border: 1px solid #334155; color: #94a3b8; padding: 10px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .submit-btn { background: #6366f1; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .loading { text-align: center; padding: 60px; color: #475569; font-size: 15px; }
  .spinner { width: 32px; height: 32px; border: 3px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  app-chatbot { display: contents; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 14px 18px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 3000; }
  .toast.show { opacity: 1; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #111827; }
  ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #4B5563; }
</style>
<script src="/components.js" defer></script>
</head>
<body>
<app-sidebar active="dashboard"></app-sidebar>

<div class="main">
  <div class="topbar">
    <!-- .topbar-hamburger injected here by components.js when sidebar is hidden -->
    <div class="topbar-left">
      <h1>Lead Qualifier Dashboard</h1>
    </div>
    <div class="topbar-right">
      <div class="stats">
        <div class="stat"><div class="stat-num" id="total">-</div><div class="stat-label">Total</div></div>
        <div class="stat"><div class="stat-num hot-num" id="hot-count">-</div><div class="stat-label">Hot</div></div>
        <div class="stat"><div class="stat-num warm-num" id="warm-count">-</div><div class="stat-label">Warm</div></div>
        <div class="stat"><div class="stat-num cold-num" id="cold-count">-</div><div class="stat-label">Cold</div></div>
      </div>
      <div class="dropdown">
        <button class="add-btn" onclick="toggleDropdown()">Add Lead</button>
        <div class="dropdown-menu" id="lead-dropdown">
          <div class="dropdown-item" onclick="openModal()">Single Lead</div>
          <div class="dropdown-item" onclick="document.getElementById('csv-upload').click()">Bulk Upload CSV</div>
        </div>
        <input type="file" id="csv-upload" accept=".csv" style="display:none" onchange="uploadCSV()">
      </div>
    </div>
  </div>

  <div id="dashboard-content" class="content">
    <div class="table-panel">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        AI is qualifying leads...
      </div>
      <table class="table" id="leads-table" style="display:none">
        <thead>
          <tr>
            <th>Name</th><th>Role</th><th>Company</th><th>Industry</th><th>Country</th><th>Score</th><th>Status</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="leads-body"></tbody>
      </table>
    </div>
    <div class="detail-panel" id="detail-panel"></div>
  </div>

  <div id="sales-content" class="sales-panel">
    <div class="sales-layout">
      <div class="leads-list">
        <h3>Select a Lead</h3>
        <div id="sales-leads-container">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
      <div class="assistant-panel" id="sales-assistant-panel">
        <div class="empty-state">
          <div></div>
          <p>Select a lead to get AI-powered sales assistance</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add / Edit Lead Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>Add New Lead</h2>
    <div class="form-grid">
      <div class="form-group"><label>Full Name</label><input type="text" id="f-name" placeholder="John Smith"></div>
      <div class="form-group"><label>Role</label><input type="text" id="f-role" placeholder="CEO"></div>
      <div class="form-group"><label>Company</label><input type="text" id="f-company" placeholder="TechCorp"></div>
      <div class="form-group">
        <label>Industry</label>
        <select id="f-industry"><option>EdTech</option><option>Pharma</option><option>Retail</option><option>Real Estate</option><option>Media</option></select>
      </div>
      <div class="form-group">
        <label>Country</label>
        <select id="f-country"><option>USA</option><option>Canada</option><option>Singapore</option><option>UAE</option><option>India</option></select>
      </div>
      <div class="form-group"><label>Company Size</label><input type="number" id="f-size" placeholder="250"></div>
      <div class="form-group"><label>Phone Number</label><input type="text" id="f-phone" placeholder="+1 555 123 4567"></div>
      <div class="form-group"><label>Work Email</label><input type="email" id="f-email" placeholder="john@company.com"></div>
      <div class="form-group"><label>LinkedIn Profile</label><input type="url" id="f-linkedin" placeholder="https://linkedin.com/in/johnsmith"></div>
      <div class="form-group"><label>Website</label><input type="url" id="f-website" placeholder="https://company.com"></div>
      <div class="form-group full"><label>Engagement</label><textarea id="f-engagement" placeholder="Opened email 3 times, replied once"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      <button class="submit-btn" id="submit-btn" onclick="submitLead()">Qualify Lead</button>
    </div>
  </div>
</div>

<script>
let allLeads = [];
let currentFilterCategory = 'status'; 
let currentFilterValue = 'all';       
let currentSortToken = 'none';
let currentSearchQuery = ''; // <-- Tracks active search query strings
let activeTab = 'dashboard';

function syncSidebarUI() {
  if (activeTab === 'sales') return; 
  
  let options = [{ value: 'all', label: 'All Leads' }];
  
  if (currentFilterCategory === 'status') {
    options.push({ value: 'Hot', label: 'Hot' }, { value: 'Warm', label: 'Warm' }, { value: 'Cold', label: 'Cold' });
  } else {
    let uniqueValues = [...new Set(allLeads.map(l => l[currentFilterCategory]).filter(Boolean))];
    uniqueValues.forEach(val => options.push({ value: val, label: val }));
  }
  
  window.renderSidebarSubButtons(options, currentFilterValue, 'executeIndexFilter');
}

function handleCategoryChange(category) {
  currentFilterCategory = category;
  currentFilterValue = 'all'; 
  syncSidebarUI();
  executeIndexFilter('all');
}
window.handleCategoryChange = handleCategoryChange;

function executeIndexFilter(value) {
  currentFilterValue = value;
  syncSidebarUI();
  applyCombinedFilters();
}
window.executeIndexFilter = executeIndexFilter;

function searchLeads(query) {
  currentSearchQuery = query.toLowerCase().trim();
  applyCombinedFilters();
}
window.searchLeads = searchLeads;

function sortLeads(sortToken) {
  currentSortToken = sortToken;
  applyCombinedFilters();
}
window.sortLeads = sortLeads;

function applyCombinedFilters() {
  let workingLeads = currentFilterValue === 'all' 
    ? [...allLeads] 
    : allLeads.filter(l => String(l[currentFilterCategory]) === currentFilterValue);
  if (currentSearchQuery) {
    workingLeads = workingLeads.filter(l => {
      const name = String(l.full_name || '').toLowerCase();
      const company = String(l.company_name || '').toLowerCase();
      const designation = String(l.designation || '').toLowerCase();
      const industry = String(l.industry || '').toLowerCase();
      const country = String(l.country || '').toLowerCase();
      
      return name.includes(currentSearchQuery) || 
             company.includes(currentSearchQuery) || 
             designation.includes(currentSearchQuery) ||
             industry.includes(currentSearchQuery) ||
             country.includes(currentSearchQuery);
    });
  }
  
  if (currentSortToken === 'name-asc') {
    workingLeads.sort((a, b) => String(a.full_name || '').localeCompare(String(b.full_name || '')));
  } else if (currentSortToken === 'name-desc') {
    workingLeads.sort((a, b) => String(b.full_name || '').localeCompare(String(a.full_name || '')));
  } else if (currentSortToken === 'score-asc') {
    workingLeads.sort((a, b) => (parseInt(a.score) || 0) - (parseInt(b.score) || 0));
  } else if (currentSortToken === 'score-desc') {
    workingLeads.sort((a, b) => (parseInt(b.score) || 0) - (parseInt(a.score) || 0));
  }
  
  renderTable(workingLeads);
  updateStats(allLeads); // Keep global dashboard counters constant
}

function sanitizeTextForHTML(text) {
  if (text == null) return '';
  return String(text)
    .replace(/[""]/g, '"').replace(/['']/g, "'").replace(/—/g, '&mdash;')
    .replace(/…/g, '&hellip;').replace(/•/g, '&bull;').replace(/→/g, '&rarr;')
    .replace(/←/g, '&larr;').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function sanitizeTextForText(text) {
  if (text == null) return '';
  return String(text)
    .replace(/[""]/g, '"').replace(/['']/g, "'").replace(/—/g, '-')
    .replace(/…/g, '...').replace(/•/g, '-').replace(/→/g, '->').replace(/←/g, '<-');
}

function htmlEncode(text) {
  return sanitizeTextForHTML(text).replace(/\n/g, '<br>');
}

async function loadLeads() {
  const res = await fetch('/api/leads');
  allLeads = await res.json();
  currentSalesLeads = allLeads;
  renderTable(allLeads);
  updateStats(allLeads);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('leads-table').style.display = 'table';
  syncSidebarUI();
  const params = new URLSearchParams(window.location.search);
  if (params.get('tab') === 'sales') {
    showTab('sales');
  } else {
    showTab('dashboard');
  }
}

function updateFilterButtons(status) {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    const value = btn.dataset.status;
    if (value !== undefined) btn.classList.toggle('active', value === status);
  });
}

function applyFilter(status, targetTab) {
  currentFilter = status;
  updateFilterButtons(status);
  const filtered = status === 'all' ? allLeads : allLeads.filter(l => l.status === status);

  if (targetTab === 'sales') {
    currentSalesLeads = filtered;
    if (!filtered.length) {
      renderSalesLeads();
      document.getElementById('sales-assistant-panel').innerHTML = `
        <div class="empty-state"><div></div><p>No ${status.toLowerCase()} leads available.</p></div>`;
      salesSelectedIndex = null;
      return;
    }
    if (salesSelectedIndex === null || !filtered.some(lead => lead === allLeads[salesSelectedIndex])) {
      salesSelectedIndex = null;
      renderSalesLeads();
      document.getElementById('sales-assistant-panel').innerHTML = `
        <div class="empty-state"><div></div><p>Select a lead to get AI-powered sales assistance</p></div>`;
      return;
    }
    renderSalesLeads();
    return;
  }

  renderTable(filtered);
  updateStats(filtered);
  document.getElementById('detail-panel').classList.remove('open');
}

function filterLeads(status) {
  applyFilter(status, activeTab === 'sales' ? 'sales' : 'dashboard');
}

function updateStats(leads) {
  document.getElementById('total').textContent = leads.length;
  document.getElementById('hot-count').textContent = leads.filter(l => l.status === 'Hot').length;
  document.getElementById('warm-count').textContent = leads.filter(l => l.status === 'Warm').length;
  document.getElementById('cold-count').textContent = leads.filter(l => l.status === 'Cold').length;
}

function showTab(tab) {
  activeTab = tab;
  document.getElementById('dashboard-content').style.display = tab === 'dashboard' ? 'flex' : 'none';
  document.getElementById('sales-content').style.display = tab === 'sales' ? 'block' : 'none';

  if (tab === 'dashboard') {
    currentFilter = 'all';
    updateFilterButtons('all');
    applyFilter('all', 'dashboard');
  } else {
    applyFilter(currentFilter, tab);
  }
}

let salesSelectedIndex = null;
let currentSalesLeads = [];

function renderSalesLeads(leads = currentSalesLeads) {
  const container = document.getElementById('sales-leads-container');
  if (!leads.length) {
    container.innerHTML = allLeads.length === 0
      ? '<div class="loading"><div class="spinner"></div></div>'
      : '<div class="empty-state"><div></div><p>No leads match this filter.</p></div>';
    return;
  }
  currentSalesLeads = leads;
  container.innerHTML = leads.map(lead => {
    const realIndex = allLeads.indexOf(lead);
    return `
      <div class="lead-item ${salesSelectedIndex === realIndex ? 'active' : ''}" onclick="selectSalesLead(${realIndex})">
        <div class="lead-item-name">${sanitizeTextForHTML(lead.full_name)}</div>
        <div class="lead-item-role">${sanitizeTextForHTML(lead.designation)} at ${sanitizeTextForHTML(lead.company_name)}</div>
        <span class="badge badge-${(lead.status||'cold').toLowerCase()}">${sanitizeTextForHTML(lead.status||'Unknown')}</span>
      </div>`;
  }).join('');
}

async function selectSalesLead(index) {
  salesSelectedIndex = index;
  renderSalesLeads();
  const panel = document.getElementById('sales-assistant-panel');
  panel.innerHTML = `<div class="loading"><div class="spinner"></div><p style="color:#475569;font-size:13px">Generating sales intelligence...</p></div>`;
  const res = await fetch(`/api/sales-assistant/${index}`);
  const data = await res.json();
  const lead = data.lead;
  panel.innerHTML = `
    <div class="lead-header">
      <div class="lead-header-info">
        <h2>${sanitizeTextForHTML(lead.full_name)}</h2>
        <p>${sanitizeTextForHTML(lead.designation)} at ${sanitizeTextForHTML(lead.company_name)}</p>
      </div>
      <div class="lead-header-meta">
        <span class="badge badge-${(lead.status||'cold').toLowerCase()}">${sanitizeTextForHTML(lead.status||'Unknown')}</span>
        <div style="margin-top:6px">Score: ${sanitizeTextForText(lead.score)}/100</div>
        <div>${sanitizeTextForHTML(lead.industry)} · ${sanitizeTextForHTML(lead.country)}</div>
      </div>
    </div>
    <div class="tools-grid">
      <div class="tool-card"><div class="tool-title">Discovery Questions</div><div class="tool-content">${htmlEncode(data.discovery_questions)}</div></div>
      <div class="tool-card"><div class="tool-title">Pitch Suggestion</div><div class="tool-content">${htmlEncode(data.pitch_suggestion)}</div></div>
    </div>
    <div class="summary-section">
      <div class="summary-title">Meeting Summary Generator</div>
      <textarea class="summary-textarea" id="meeting-notes" placeholder="Paste your meeting notes here..."></textarea>
      <button class="generate-btn" id="summary-btn" onclick="generateSalesSummary(${index})">Generate Summary</button>
      <div class="summary-output" id="summary-output"></div>
    </div>`;
}

async function generateSalesSummary(index) {
  const notes = document.getElementById('meeting-notes').value.trim();
  if (!notes) { alert('Please enter meeting notes first'); return; }
  const btn = document.getElementById('summary-btn');
  btn.disabled = true; btn.textContent = 'Generating...';
  const lead = allLeads[index];
  const res = await fetch('/api/meeting-summary', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lead_name: lead.full_name, lead_role: lead.designation, lead_company: lead.company_name, lead_industry: lead.industry, notes })
  });
  const data = await res.json();
  const output = document.getElementById('summary-output');
  output.style.display = 'block';
  output.textContent = sanitizeTextForText(data.summary);
  btn.disabled = false; btn.textContent = 'Generate Summary';
}

function getScoreColor(score) {
  if (score >= 80) return '#ef4444';
  if (score >= 50) return '#f59e0b';
  return '#3b82f6';
}

function renderTable(leads) {
  const tbody = document.getElementById('leads-body');
  tbody.innerHTML = leads.map(lead => {
    const realIndex = allLeads.indexOf(lead);
    const score = parseInt(lead.score) || 0;
    return `
    <tr id="row-${realIndex}" onclick="showDetail(${realIndex})">
      <td><strong>${window.safeHTML(lead.full_name)}</strong></td>
      <td>${window.safeHTML(lead.designation)}</td>
      <td>${window.safeHTML(lead.company_name)}</td>
      <td>${window.safeHTML(lead.industry)}</td>
      <td>${window.safeHTML(lead.country)}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="score-bar"><div class="score-fill" style="width:${score}%;background:${getScoreColor(parseInt(score))}"></div></div>
          <span style="font-size:12px;color:#94a3b8">${score}</span>
        </div>
      </td>
      <td><span class="badge badge-${(lead.status||'cold').toLowerCase()}">${window.safeHTML(lead.status||'Unknown')}</span></td>
      <td>
        <div class="action-wrapper" onclick="event.stopPropagation()">
          <button class="action-btn" onclick="event.stopPropagation(); toggleActionMenu(event,${realIndex})">Actions</button>
          <div class="action-menu" id="action-menu-${realIndex}">
            <button onclick="openEditModal(${realIndex})">Modify</button>
            <button class="delete-btn-menu" onclick="deleteLead(event,'${lead._record_id}')">Delete</button>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function formatUrlLink(value) {
  if (!value) return '-';
  const t = String(value).trim();
  if (!t) return '-';
  const url = /^https?:\/\//i.test(t) ? t : `https://${t}`;
  return `<a href="${url}" target="_blank" rel="noopener noreferrer">${t}</a>`;
}

function formatEmailLink(value) {
  if (!value) return '-';
  const t = String(value).trim();
  return t ? `<a href="mailto:${t}">${t}</a>` : '-';
}

function formatPhoneLink(value) {
  if (!value) return '-';
  const t = String(value).trim();
  if (!t) return '-';
  const h = t.replace(/[^+\d]/g, '');
  return `<a href="tel:${h}">${t}</a>`;
}

function showDetail(index) {
  const lead = allLeads[index];
  if (!lead) return;
  document.querySelectorAll('.table tr').forEach(r => r.classList.remove('selected'));
  const row = document.getElementById(`row-${index}`);
  if (row) row.classList.add('selected');
  
  const panel = document.getElementById('detail-panel');
  const score = parseInt(lead.score) || 0;

  // Injects the text content cleanly right as the open sliding sequence takes over
  panel.innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-name">${window.safeHTML(lead.full_name)}</div>
        <div class="detail-role">${window.safeHTML(lead.designation)} at ${window.safeHTML(lead.company_name)}</div>
      </div>
      <button class="detail-close-btn" onclick="closeDetailPanel()">&times;</button>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Overview</div>
      <div class="detail-row"><span class="detail-row-label">Status</span><span class="detail-row-value"><span class="detail-status badge badge-${(lead.status||'cold').toLowerCase()}">${window.safeHTML(lead.status||'Unknown')}</span></span></div>
      <div class="detail-row"><span class="detail-row-label">Industry</span><span class="detail-row-value">${window.safeHTML(lead.industry||'-')}</span></div>
      <div class="detail-row"><span class="detail-row-label">Country</span><span class="detail-row-value">${window.safeHTML(lead.country||'-')}</span></div>
      <div class="detail-row"><span class="detail-row-label">Company Size</span><span class="detail-row-value">${lead.company_size ? window.safeHTML(`${lead.company_size} employees`) : '-'}</span></div>
      <div class="detail-row"><span class="detail-row-label">Score</span><span class="detail-row-value">${score}/100</span></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Contact Information</div>
      <div class="detail-row"><span class="detail-row-label">Email</span><span class="detail-row-value">${formatEmailLink(lead.work_email)}</span></div>
      <div class="detail-row"><span class="detail-row-label">Phone</span><span class="detail-row-value">${formatPhoneLink(lead.phone_number)}</span></div>
      <div class="detail-row"><span class="detail-row-label">Website</span><span class="detail-row-value">${formatUrlLink(lead.website)}</span></div>
      <div class="detail-row"><span class="detail-row-label">LinkedIn</span><span class="detail-row-value">${formatUrlLink(lead.linkedin_profile)}</span></div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Engagement</div>
      <div class="detail-reason">${window.safeHTML(lead.engagement||'No engagement details available')}</div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">AI Analysis</div>
      <div class="detail-reason">${window.safeHTML(lead.score_explanation||'No reason provided')}</div>
    </div>
    <div class="detail-action-group">
      <button class="detail-action-btn" onclick="openEditModal(${index})">Modify Lead</button>
      <button class="detail-action-btn delete-detail" onclick="deleteLead(event,'${lead._record_id}')">Delete Lead</button>
    </div>
    <a href="/sales-assistant?lead=${index}" class="detail-action-btn">Open Sales Assistant</a>`;

  panel.classList.add('open');
}

async function deleteLead(event, recordId) {
  event.stopPropagation();
  const index = allLeads.findIndex(l => l._record_id === recordId);
  if (index === -1) return;
  if (!confirm(`Delete ${allLeads[index].full_name}?`)) return;
  const res = await fetch(`/api/leads/${recordId}`, { method: 'DELETE' });
  if (res.ok) {
    allLeads.splice(index, 1);
    executeIndexFilter(currentFilterValue);
    const filtered = currentFilter === 'all' ? allLeads : allLeads.filter(l => l.status === currentFilter);
    renderTable(filtered);
    updateStats(filtered);
    document.getElementById('detail-panel').classList.remove('open');
  }
}

let currentEditRecordId = null;

function openModal() {
  currentEditRecordId = null;
  document.getElementById('modal').classList.add('open');
  document.querySelector('.modal h2').textContent = 'Add New Lead';
  document.getElementById('submit-btn').textContent = 'Qualify Lead';
  document.getElementById('f-industry').value = 'EdTech';
  document.getElementById('f-country').value = 'USA';
}

function openEditModal(index) {
  const lead = allLeads[index];
  if (!lead) return;
  currentEditRecordId = lead._record_id;
  document.getElementById('modal').classList.add('open');
  document.querySelector('.modal h2').textContent = 'Edit Lead';
  document.getElementById('submit-btn').textContent = 'Save Changes';
  document.getElementById('f-name').value = lead.full_name || '';
  document.getElementById('f-role').value = lead.designation || '';
  document.getElementById('f-company').value = lead.company_name || '';
  document.getElementById('f-industry').value = lead.industry || 'EdTech';
  document.getElementById('f-country').value = lead.country || 'USA';
  document.getElementById('f-size').value = lead.company_size || '';
  document.getElementById('f-phone').value = lead.phone_number || '';
  document.getElementById('f-email').value = lead.work_email || '';
  document.getElementById('f-linkedin').value = lead.linkedin_profile || '';
  document.getElementById('f-website').value = lead.website || '';
  document.getElementById('f-engagement').value = lead.engagement || '';
  closeAllActionMenus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function toggleDropdown() {
  document.getElementById('lead-dropdown').classList.toggle('open');
}

window.addEventListener('click', function(e) {
  if (!e.target.closest('.dropdown')) document.getElementById('lead-dropdown').classList.remove('open');
  if (!e.target.closest('.action-wrapper')) closeAllActionMenus();
});

function toggleActionMenu(event, index) {
  event.stopPropagation();
  closeAllActionMenus();
  const menu = document.getElementById(`action-menu-${index}`);
  if (menu) menu.classList.toggle('open');
}

function closeAllActionMenus() {
  document.querySelectorAll('.action-menu.open').forEach(m => m.classList.remove('open'));
}

async function submitLead() {
  const name = document.getElementById('f-name').value.trim();
  const role = document.getElementById('f-role').value.trim();
  const company = document.getElementById('f-company').value.trim();
  const size = document.getElementById('f-size').value.trim();
  const engagement = document.getElementById('f-engagement').value.trim();
  if (!name || !role || !company || !size || !engagement) { alert('Please fill in all fields'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = currentEditRecordId ? 'Saving...' : 'Qualifying...';

  const lead = {
    full_name: name, designation: role, company_name: company,
    industry: document.getElementById('f-industry').value,
    country: document.getElementById('f-country').value,
    linkedin_profile: document.getElementById('f-linkedin').value.trim() || '',
    work_email: document.getElementById('f-email').value.trim() || '',
    phone_number: document.getElementById('f-phone').value.trim() || '',
    website: document.getElementById('f-website').value.trim() || '',
    company_size: parseInt(size), engagement
  };

  const url = currentEditRecordId ? `/api/leads/${currentEditRecordId}` : '/api/leads';
  const method = currentEditRecordId ? 'PUT' : 'POST';
  const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(lead) });
  const qualified = await res.json();

  if (currentEditRecordId) {
    const i = allLeads.findIndex(l => l._record_id === currentEditRecordId);
    if (i !== -1) allLeads[i] = { ...allLeads[i], ...qualified };
  } else {
    allLeads.push(qualified);
  }

  const filtered = currentFilter === 'all' ? allLeads : allLeads.filter(l => l.status === currentFilter);
  renderTable(filtered);
  updateStats(filtered);
  closeModal();

  btn.disabled = false;
  btn.textContent = currentEditRecordId ? 'Save Changes' : 'Qualify Lead';
  currentEditRecordId = null;
  ['f-name','f-role','f-company','f-size','f-phone','f-email','f-linkedin','f-website','f-engagement'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.querySelector('.modal h2').textContent = 'Add New Lead';
  document.getElementById('submit-btn').textContent = 'Qualify Lead';
}

async function uploadCSV() {
  const fileInput = document.getElementById('csv-upload');
  if (!fileInput.files.length) { alert('Please select a CSV file'); return; }
  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  const res = await fetch('/api/leads/upload-csv', { method: 'POST', body: formData });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { showToast(data.error || 'CSV upload failed. Please check the file format.'); return; }
  showToast(`${data.added} leads added, ${data.replaced} duplicates updated`);
  fileInput.value = '';
  loadLeads();
}

function closeDetailPanel() {
  document.getElementById('detail-panel').classList.remove('open');
  document.querySelectorAll('.table tr').forEach(r => r.classList.remove('selected'));
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

document.addEventListener('DOMContentLoaded', () => {
  loadLeads();
  restoreSidebarState();
});
